services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

  gateway:
    build:
      context: ../../..
      dockerfile: evals/deploy/http-gateway/Dockerfile.gateway
    restart: unless-stopped
    environment:
      - MODEL_GATEWAY_RUN_TOKEN_SECRET
      - LITELLM_ADMIN_TOKEN
      - HARNESS_MODEL_PRICES_JSON
      - HTTP_GATEWAY_HOST=0.0.0.0
      - HTTP_GATEWAY_PORT=8080
      - LITELLM_GATEWAY_URL=http://litellm:4000
      - GATEWAY_STORE_DIR=/var/lib/coding-agent/gateway
      - HARNESS_CALL_STORE_DIR=/var/lib/coding-agent/http
    volumes:
      - ${GATEWAY_STATE_DIR:-/var/lib/coding-agent-platform}:/var/lib/coding-agent
    depends_on:
      - litellm

  litellm:
    build:
      context: ../../..
      dockerfile: evals/deploy/http-gateway/Dockerfile.litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    depends_on:
      - postgres

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
