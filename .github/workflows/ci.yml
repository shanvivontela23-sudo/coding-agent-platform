name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Bootstrap lockfile onto this same-repository PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'p0-02-followup-sealing-lockfile'
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: commit pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
